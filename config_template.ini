[general]
game =
mipmaps = yes
mipmap_maxlevel = 2
# keep the command line window open
keep_open = no

[manager]
# time in seconds between live reload checks
period = 3
# which plugins should go first during callbacks
priority = zoom noise keybinds fps extra_info map playerlist

[plugin_zoom]
fast = no
# internal draw width; negative values mean 1:1 scale
level = -1
# transition time in seconds, 0 = instant
time = 0

[plugin_misc]
# use borderless windowed mode, with pre-defined location and size
fixed_window = no
# window coordinates (to position on different displays, consult remote.log for corner coordinates)
window_x = 0
window_y = 0
window_width = 1280
window_height = 720
# centered camera: 0 = disabled, 1 = centered and inbounds, 2 = always centered
centered = 0
# if background color is brighter than this value, it is reduced to match
# useful when drawUniform = no
max_bg_value = 1
# in seconds
hide_cursor_after = 2
# these correspond to "admin keys". make your own keybinds if you need
drawHUD = yes
drawTiles = yes
drawEdge = yes
drawScatter = yes
drawUniform = yes
drawHitBoxes = no
drawBoxes = no

[plugin_fps]
size = 16
color = ff0
# time between updates in seconds
update = 0.5
# sliding window size, in seconds
average = 1
# time reserve indicator (~= network/server lag)
res_size = 14
res_color = fff
res_warning = f00

[plugin_hud]
# coordinates of the top-mid point between hp and hpmax
x = 120
y = 50
# spacing added between lines
spacing = -20
# font sizes
size_hp = 50
size_hpmax = 32
size_ammo = 32
size_ammomax = 24
size_currency = 12
# colors
color_hp = fff
color_hp_full = 9f9
color_ammo = ffb
color_currency = fff
# outline size
outline = 3
# health bar size in pixels
bar_width = 90
bar_height = 4
# vertical offset from top of the shell
bar_y = 10
# health bar colors
bar_background = 000000
bar_outline = 808080
bar_color = 0afde1
bar_notches = ffffff

[plugin_map]
visible = no
# auto-hide if a room is smaller in both dimensions than what is visible times this value (set to 0 to disable)
small_room = 0
# position anchor point (0..1, 0 = top/left, 1 = bottom/right)
px = 0.5
py = 0.5
# maximum part of the screen occupied by the map
w = 0.9
h = 0.9
# hide in lobby and bosses? pretty crude
hide_outside_zones = no
# element colors
bg = 90000000
platform = fff
ledge = aaa
enemy = f00
enemy_harmless = f80
player = ff0
player_self = 0f0
interact = 0ff
trigger = f0f
item = 0
chest = 08f

[plugin_extra_info]
# trigger zones
trigger_color = 80ff00ff
trigger_frame = 3
# object health/armor
show_hp = no
# portal player counts, key counts
show_uses = yes
# display zone name and floor number in bottom right corner
show_room_id = yes
# enabled types of arrows
arrows = door shop secret arcade hp boost player
# default arrow color
arrows_color = fff
# arrow size (in pixels)
arrows_length = 30
arrows_width = 15
arrows_outline = 2
# border width of visible target objects
arrows_frame = 5
# distance when visuals start to fade out
arrows_fade = 500
# blink period in seconds (0 to disable)
arrows_blink = 0
# you can set any of the above options for different types separately
arrow_door_color = ff0
arrow_shop_color = 08f
arrow_secret_color = 00f
arrow_arcade_color = f80
arrow_hp_color = 0f0
arrow_hp_frame = 99
arrow_hp_blink = 0.3
arrow_boost_color = 8f0
arrow_boost_frame = 99
arrow_player_color = 0f0
arrow_player_frame = 0
arrow_player_width = 7
arrow_player_length = 6

[plugin_noise]
damage_flash_intensity = 1
# other player shells
hide_shells = no
# other player info
hide_names = no
hide_factions = no
hide_healthbars = no
# objects created by other players (except for macrons)
hide_ally_objects = no
# damage effects, death animations, particle trails
hide_effects = no
# replace screen shake and flash effects with an indicator
replace_shake = no
# hide chat
hide_chat = no

[plugin_playerlist]
visible = no
# font size
size = 14

[plugin_squid_prediction]
# --- v3.0 configs ---
enable = yes
# show number of living squids
squid_count_alive_show = yes
# show total number of squids
squid_count_total_show = yes
# hide green squids since they are not necessary
hide_green_squids = yes
# show prediction box
box_show = yes
# show an outline around box
box_outline_show = yes
# show countdown until squid is active
number_show = yes
# fade box color between two values (values defined below)
color_fade = yes
# --- box opts ---
# box color when not using fading
box_default_color = ff7f00
# color the box starts as when fading
box_fade_start_color = ffff00
# color the box becomes when fading
box_fade_end_color = ff0000
box_transparency = 0.6
# --- box outline opts ---
box_outline_color = ff0000
box_outline_transparency = 1
box_outline_thickness = 2
# --- countdown number opts ---
number_size = 16
number_outline_size = 2
number_color = ffc300
number_outline_color = 00
# --- squid count opts ---
squid_count_alive_size = 16
squid_count_total_size = 12
squid_count_x = 400
squid_count_y = 200


; long version
[plugin_more_misc]
# --- v1.11.0 short config ---
# Custom BG
draw_bg = yes
base_color = ffffff
change_speed = 0
# Extra Hiding
hide_extras = yes
# Mini HUD
show_mini_hud = yes
show_mini_hp = yes
show_mini_ammo = yes
show_spam_timer = yes
# EC Counter
show_ec_counter = yes
# Spin Bar
show_spin_bar = yes
spin_duration = 800
spin_bar_color = ffff80
# Server Reminder
show_server = yes
# SC Close Timer (be online for first port)
show_sc_time = yes
# -----------------------------------------------------------------------------------
# format: PLUGIN OPTION ZONE = VALUE
# zones:
#   shop = secret shop
#   home = where you keep your stuff
#   lobby = Eschaton Station
#   ice, iceHard, ice_boss = (Elite) Frozen Blight
#   forest, forestHard, forest_boss = (Elite) Fire Forest
#   city, cityHard, city_boss = (Elite) Vanquished
#   cave, caveHard, cave_boss = (Elite) Fungus Cave
#   dumb, dumbHard, dumb_boss = (Elite) Underground Base
#   jungle, jungleHard, jungle_boss = (Elite) Strands
#   hulk, hulkHard, hulk_boss = (Elite) Graveyard
#   lab, labHard, lab_boss = (Elite) Temple of the Lost
#   sc, sc_boss = Star Cathedral
# Since boss rooms do not have zone names, the music is used to detect it instead
# This means that you cannot tell the difference between a regular boss and an elite boss
# "Hard" stands for Elite, and "_boss" stands for boss
# Secrets dont have a zone name while shops do
misc centered home = 1
misc centered lobby = 1
misc centered jungleHard = 2
misc centered jungle = 2
# long version extension:
show_aura = yes
x_hp = 30
y_hp = 35
size_hp = 18
size_maxhp = 14
color_hp = ffffffff
color_hp_full = ff00ff00
x_ammo = -35
y_ammo = 35
size_ammo = 14
size_maxammo = 14
outline_ammo = 2
outline_maxammo = 2
color_ammo = ffff80
color_ammo_full = ffff80
x_spam = -48
y_spam = 50
size_spam = 14
outline_spam = 2
color_spam = ffff80
x_ec = 120
y_ec = 165
size_ec = 12
outline_ec = f0f0f0
font_ec = HemiHeadBold
spin_bar_y = 10
spin_bar_width = 90
spin_bar_height = 4
spin_bar_side = 3
warn_percent = 30
spin_bar_background = ff000000
spin_bar_background_warn = ff8080
spin_bar_outline = ff808080
x_server = 120
y_server = 200
size_server = 12
outline_server = 3
color_server = f0f0f0
font_server = HemiHeadBold
play_sc_audio_cue = yes
sc_close_timer_duration = 20

[plugin_gy_highlight]
highlight_engineers = yes
highlight_pathlights = no
box_color = ffffff
box_transparency = 0.6
box_show = yes
box_outline_color = ffffff
box_outline_transparency = 1
box_outline_thickness = 2
box_outline_show = no

